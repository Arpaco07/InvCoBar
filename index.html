
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Los Pares — Acceso</title>
<style>
:root{
  --bg:#f5f8fc; --panel:#ffffff; --line:#d8e3f3; --text:#20324a; --muted:#6b7a90;
  --primary:#1f6fff; --primary-soft:#eaf2ff; --ok:#16a34a; --err:#dc2626;
}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#eef5ff,#f8fbff);min-height:100vh;display:grid;place-items:center;color:var(--text)}
.card{width:min(380px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px 24px;box-shadow:0 20px 60px rgba(31,111,255,.08)}
.brand{text-align:center;margin-bottom:18px}
.brand img{width:92px;height:92px;object-fit:contain;border-radius:22px;background:#0b0b0b;padding:10px;box-shadow:0 10px 24px rgba(0,0,0,.12)}
h1{font-size:28px;margin:14px 0 6px} .sub{color:var(--muted);font-size:13px;line-height:1.5}
.dots{display:flex;justify-content:center;gap:14px;margin:22px 0}
.dot{width:18px;height:18px;border-radius:999px;border:2px solid #bfd2ef;background:white}
.dot.filled{background:var(--primary);border-color:var(--primary)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button,.action{border:none;border-radius:16px;cursor:pointer;font-weight:700}
.pad button{height:62px;background:#f7faff;border:1px solid var(--line);font-size:20px;color:var(--text)}
.pad button:active{transform:scale(.98)}
.action{width:100%;margin-top:14px;padding:16px;background:var(--primary);color:white;letter-spacing:2px}
.action:disabled{opacity:.35}
.status{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:13px;display:none}
.status.show{display:block}.status.ok{background:#ecfdf3;color:var(--ok);border:1px solid #b8f0cb}.status.err{background:#fef2f2;color:var(--err);border:1px solid #fecaca}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img src="logo_pares.png" alt="Los Pares">
    <h1>Los Pares</h1>
    <div class="sub">Sistema de declaración diaria por área<br>Mini sistema de control contra inventario general</div>
  </div>

  <div class="dots">
    <div class="dot" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
  </div>

  <div class="pad">
    <button onclick="addDigit('1')">1</button>
    <button onclick="addDigit('2')">2</button>
    <button onclick="addDigit('3')">3</button>
    <button onclick="addDigit('4')">4</button>
    <button onclick="addDigit('5')">5</button>
    <button onclick="addDigit('6')">6</button>
    <button onclick="addDigit('7')">7</button>
    <button onclick="addDigit('8')">8</button>
    <button onclick="addDigit('9')">9</button>
    <button onclick="delDigit()">⌫</button>
    <button onclick="addDigit('0')">0</button>
    <button onclick="login()">↵</button>
  </div>

  <button class="action" id="btnEnter" onclick="login()" disabled>ENTRAR</button>
  <div class="status" id="status"></div>
  <div class="foot">Google Sheets + Apps Script + HTML</div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyBaaFpvm44mgPupgDFTR4ZhMpp4MRc9D_8waIzno8iI1czX-Jt1mGBQymALL9oZneTXw/exec';
let pin = '';

(function boot(){
  const token = localStorage.getItem('token');
  const raw = localStorage.getItem('usuario');
  if (!token || !raw) return;
  try {
    const u = JSON.parse(raw);
    location.href = String(u.rol).toUpperCase() === 'ADMIN' ? 'admin.html' : 'staff.html';
  } catch (_) {}
})();

function addDigit(d){
  if (pin.length >= 4) return;
  pin += d;
  renderPin();
  if (pin.length === 4) setTimeout(login, 120);
}
function delDigit(){ pin = pin.slice(0,-1); renderPin(); }
function renderPin(){
  for(let i=0;i<4;i++) document.getElementById('d'+i).classList.toggle('filled', i < pin.length);
  document.getElementById('btnEnter').disabled = pin.length !== 4;
}
function setStatus(msg, cls){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status show ' + cls;
}

async function login(){
  if (pin.length !== 4) return;
  setStatus('Verificando acceso…','');
  try{
    const r = await fetch(API, { method:'POST', body: JSON.stringify({ action:'login', pin }) });
    const data = await r.json();
    if (!data.ok) {
      setStatus(data.error || 'PIN incorrecto','err');
      pin=''; renderPin();
      return;
    }
    localStorage.setItem('token', data.token);
    localStorage.setItem('usuario', JSON.stringify(data.usuario));
    setStatus('Acceso correcto','ok');
    setTimeout(() => {
      location.href = String(data.usuario.rol).toUpperCase() === 'ADMIN' ? 'admin.html' : 'staff.html';
    }, 240);
  }catch(e){
    setStatus('No hubo respuesta del servidor','err');
    pin=''; renderPin();
  }
}
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') addDigit(e.key);
  if (e.key === 'Backspace') delDigit();
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
