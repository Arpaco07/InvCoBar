<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pares 84×88 — Acceso</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap');
  :root{
    --bg:#090909;--panel:#111;--line:#1f1f1f;--text:#e8e4dc;--muted:#707070;--soft:#151515;
    --ok:#3ecf8e;--err:#e05555;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:grid;place-items:center;background:
    radial-gradient(circle at top, #171717, #090909 45%);
    color:var(--text);font-family:'Space Mono',monospace;padding:24px
  }
  .card{
    width:min(360px,100%);background:rgba(17,17,17,.98);border:1px solid var(--line);
    border-radius:24px;padding:34px 28px 28px;box-shadow:0 18px 50px rgba(0,0,0,.35)
  }
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px}
  .logo{
    width:82px;height:82px;border-radius:24px;border:1px solid #262626;
    display:grid;place-items:center;background:#0d0d0d;font-family:'Cormorant Garamond',serif;
    font-size:30px;letter-spacing:2px
  }
  .title{font-family:'Cormorant Garamond',serif;font-size:28px;letter-spacing:1px}
  .sub{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;text-align:center;line-height:1.8}
  .pin-wrap{margin:26px 0 18px}
  .pin-display{display:flex;justify-content:center;gap:14px;margin-bottom:22px}
  .pin-dot{width:16px;height:16px;border-radius:999px;border:1.5px solid #353535;background:transparent;transition:.18s}
  .pin-dot.filled{background:var(--text);border-color:var(--text)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .key,.btn{
    border:none;border-radius:16px;font-family:'Space Mono',monospace;cursor:pointer
  }
  .key{
    background:var(--soft);border:1px solid #242424;color:var(--text);height:62px;font-size:18px;font-weight:700
  }
  .key:active{transform:scale(.97)}
  .key.zero{grid-column:2}
  .key.del{color:#9d9d9d}
  .btn{
    width:100%;margin-top:14px;padding:16px;background:var(--text);color:#111;
    font-size:11px;letter-spacing:4px;font-weight:700
  }
  .btn:disabled{opacity:.28;cursor:not-allowed}
  .status{
    min-height:44px;margin-top:12px;border-radius:14px;padding:12px 14px;font-size:11px;
    letter-spacing:1px;display:none;align-items:center;justify-content:center;text-align:center
  }
  .status.show{display:flex}
  .status.loading{background:#121212;border:1px solid #262626;color:#9b9b9b}
  .status.ok{background:#0c1c14;border:1px solid #19402b;color:var(--ok)}
  .status.err{background:#1b0d0d;border:1px solid #4a1d1d;color:var(--err)}
  .foot{margin-top:18px;color:#4f4f4f;font-size:9px;letter-spacing:2px;text-align:center;text-transform:uppercase}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">84×88</div>
      <div class="title">Los Pares</div>
      <div class="sub">Mini sistema de inventario<br>captura diaria por área</div>
    </div>

    <div class="pin-wrap">
      <div class="pin-display">
        <div class="pin-dot" id="d0"></div>
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
      </div>

      <div class="keypad">
        <button class="key" onclick="addDigit('1')">1</button>
        <button class="key" onclick="addDigit('2')">2</button>
        <button class="key" onclick="addDigit('3')">3</button>
        <button class="key" onclick="addDigit('4')">4</button>
        <button class="key" onclick="addDigit('5')">5</button>
        <button class="key" onclick="addDigit('6')">6</button>
        <button class="key" onclick="addDigit('7')">7</button>
        <button class="key" onclick="addDigit('8')">8</button>
        <button class="key" onclick="addDigit('9')">9</button>
        <button class="key zero" onclick="addDigit('0')">0</button>
        <button class="key del" onclick="delDigit()">⌫</button>
      </div>

      <button class="btn" id="btnEnter" onclick="login()" disabled>ENTRAR</button>
      <div class="status" id="status"></div>
    </div>

    <div class="foot">GitHub Pages + Apps Script + Sheets</div>
  </div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzQ3VGL57gj-GA0AfgTAL6djmdEJgQKYEnhtNnJbX0N1ei9MK1Tzfq-aRT2sykhCaM/exec';
let pin = '';

(function boot(){
  const token = localStorage.getItem('token');
  const usuarioRaw = localStorage.getItem('usuario');
  if (!token || !usuarioRaw) return;
  try {
    const usuario = JSON.parse(usuarioRaw);
    window.location.href = usuario.rol === 'admin' ? 'admin.html' : 'staff.html';
  } catch(_) {
    localStorage.removeItem('token');
    localStorage.removeItem('usuario');
  }
})();

function updatePIN(){
  for(let i=0;i<4;i++) document.getElementById('d'+i).classList.toggle('filled', i < pin.length);
  document.getElementById('btnEnter').disabled = pin.length !== 4;
}

function addDigit(d){
  if (pin.length >= 4) return;
  pin += d;
  updatePIN();
  if (pin.length === 4) setTimeout(login, 120);
}

function delDigit(){
  pin = pin.slice(0,-1);
  updatePIN();
}

function setStatus(msg, type){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status show ' + type;
}

async function login(){
  if (pin.length !== 4) return;
  document.getElementById('btnEnter').disabled = true;
  setStatus('Verificando acceso…', 'loading');

  try{
    const r = await fetch(API, {
      method:'POST',
      body: JSON.stringify({ action:'login', pin })
    });
    const data = await r.json();

    if (!data.ok) {
      setStatus(data.error || 'PIN incorrecto', 'err');
      pin = '';
      updatePIN();
      return;
    }

    localStorage.setItem('token', data.token);
    localStorage.setItem('usuario', JSON.stringify(data.usuario));
    setStatus('Acceso correcto', 'ok');

    setTimeout(() => {
      window.location.href = data.usuario.rol === 'admin' ? 'admin.html' : 'staff.html';
    }, 250);

  } catch (e) {
    setStatus('No hubo respuesta del servidor', 'err');
    pin = '';
    updatePIN();
  }
}

document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') addDigit(e.key);
  if (e.key === 'Backspace') delDigit();
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
