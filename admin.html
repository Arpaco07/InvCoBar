<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pares 84×88 — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap');
  :root{
    --bg:#090909;--panel:#111;--line:#1d1d1d;--text:#e8e4dc;--muted:#777;
    --ok:#3ecf8e;--err:#e05555;--warn:#c084fc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace}
  header{
    position:sticky;top:0;z-index:20;background:rgba(9,9,9,.96);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px
  }
  .hl{display:flex;gap:12px;align-items:center}
  .logo{
    width:42px;height:42px;border-radius:14px;background:#111;border:1px solid #262626;display:grid;place-items:center;
    font-family:'Cormorant Garamond',serif;font-size:15px
  }
  .tt{font-size:11px;letter-spacing:3px;font-weight:700}
  .uu{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:3px}
  .badge{font-size:9px;font-weight:700;letter-spacing:2px;padding:7px 12px;border-radius:999px;background:#17121f;color:#c084fc;border:1px solid #36234b}
  .btn{border:none;cursor:pointer;font-family:'Space Mono',monospace}
  .btn-sm{
    padding:10px 14px;border-radius:12px;background:#151515;color:var(--text);
    border:1px solid #262626;font-size:10px;letter-spacing:2px
  }
  nav{display:flex;background:#0f0f0f;border-bottom:1px solid var(--line);overflow:auto}
  .tab{
    flex:1 0 auto;padding:13px 12px;text-align:center;font-size:10px;letter-spacing:1px;color:#5e5e5e;
    text-transform:uppercase;border-bottom:2px solid transparent;cursor:pointer;min-width:90px
  }
  .tab.active{color:var(--text);border-bottom-color:var(--text)}
  .screen{display:none;padding:18px 16px}
  .screen.active{display:block}
  .label{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .group{display:flex;gap:8px;flex-wrap:wrap}
  .cards{display:grid;gap:12px}
  .card,.audit,.alert,.cat-card{
    background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px
  }
  .title{font-family:'Cormorant Garamond',serif;font-size:24px;line-height:1.05}
  .meta{font-size:10px;color:#7a7a7a;letter-spacing:1px;margin-top:5px}
  .chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
  .chip{background:#0d0d0d;border:1px solid #252525;border-radius:14px;padding:12px}
  .chip-l{font-size:9px;color:#6f6f6f;letter-spacing:2px;text-transform:uppercase}
  .chip-v{font-size:18px;font-weight:700;margin-top:6px}
  .dot{width:8px;height:8px;border-radius:999px;display:inline-block;margin-right:8px}
  .dot.cocina{background:var(--ok)} .dot.barra{background:var(--err)}
  .list{display:grid;gap:10px}
  .audit-grid{display:grid;gap:10px}
  .audit-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .audit-action{font-size:10px;letter-spacing:2px;padding:6px 10px;border-radius:999px;border:1px solid #2a2a2a;color:#d3d3d3;background:#151515;text-transform:uppercase}
  .audit-detail{margin-top:8px;padding:10px 12px;border-radius:12px;background:#0d0d0d;border:1px solid #242424;color:#bcbcbc;font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .cat-top,.alert-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .tag{
    padding:5px 10px;border-radius:999px;border:1px solid #2b2b2b;color:#8e8e8e;font-size:9px;letter-spacing:2px;text-transform:uppercase
  }
  .tag.cocina{background:#0c1c14;border-color:#19402b;color:var(--ok)}
  .tag.barra{background:#1b0d0d;border-color:#4a1d1d;color:var(--err)}
  .cat-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pill{
    padding:8px 10px;border-radius:10px;font-size:10px;letter-spacing:1px;border:1px solid #2a2a2a;background:#151515;color:#d0d0d0
  }
  .pill.off{color:var(--err);border-color:#4a1d1d;background:#1b0d0d}
  .alert-val{font-size:14px;font-weight:700;margin-top:10px}
  .empty,.loading{text-align:center;padding:60px 16px;color:#444;font-size:11px;letter-spacing:3px}
  .toast{
    position:fixed;top:82px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:12px;font-size:10px;
    letter-spacing:2px;z-index:30;opacity:0;pointer-events:none;transition:.2s
  }
  .toast.show{opacity:1}
  .toast.ok{background:#0c1c14;border:1px solid #19402b;color:var(--ok)}
  .toast.err{background:#1b0d0d;border:1px solid #4a1d1d;color:var(--err)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal-bg.open{display:flex}
  .modal{width:min(520px,100%);background:#111;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:22px 18px 24px}
  .modal-title{font-family:'Cormorant Garamond',serif;font-size:28px;margin-bottom:14px}
  .grid{display:grid;gap:12px}
  .field label{display:block;margin-bottom:7px;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
  .txt,.sel{
    width:100%;background:#0b0b0b;border:1px solid #252525;border-radius:14px;color:var(--text);padding:14px 14px;font-size:15px
  }
  @media (min-width:840px){
    .screen{max-width:1100px;margin:0 auto}
    .cards.two{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<header>
  <div class="hl">
    <div class="logo">84×88</div>
    <div>
      <div class="tt">PARES 84×88</div>
      <div class="uu" id="userLine">Administrador</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <span class="badge">ADMIN</span>
    <button class="btn-sm" onclick="logout()">SALIR</button>
  </div>
</header>

<nav>
  <div class="tab active" id="tCocina" onclick="showTab('cocina')">Cocina</div>
  <div class="tab" id="tBarra" onclick="showTab('barra')">Barra</div>
  <div class="tab" id="tAuditoria" onclick="showTab('auditoria')">Auditoría</div>
  <div class="tab" id="tAlertas" onclick="showTab('alertas')">Alertas</div>
</nav>

<section class="screen active" id="sCocina">
  <div class="toolbar">
    <div class="label">Declarado por cocina</div>
    <div class="group">
      <button class="btn-sm" onclick="loadDashboard()">RECARGAR</button>
      <button class="btn-sm" onclick="openAddModal('cocina')">+ PRODUCTO</button>
    </div>
  </div>
  <div id="cocinaList" class="cards two"><div class="loading">Cargando…</div></div>
</section>

<section class="screen" id="sBarra">
  <div class="toolbar">
    <div class="label">Declarado por barra</div>
    <div class="group">
      <button class="btn-sm" onclick="loadDashboard()">RECARGAR</button>
      <button class="btn-sm" onclick="openAddModal('barra')">+ PRODUCTO</button>
    </div>
  </div>
  <div id="barraList" class="cards two"><div class="loading">Cargando…</div></div>
</section>

<section class="screen" id="sAuditoria">
  <div class="toolbar">
    <div class="label">Cambios recientes</div>
    <div class="group">
      <button class="btn-sm" onclick="loadAuditoria()">RECARGAR</button>
    </div>
  </div>
  <div id="auditList" class="audit-grid"><div class="loading">Cargando…</div></div>
</section>

<section class="screen" id="sAlertas">
  <div class="toolbar">
    <div class="label">Revisión rápida</div>
    <div class="group">
      <button class="btn-sm" onclick="buildAlerts()">ACTUALIZAR</button>
    </div>
  </div>
  <div id="alertList" class="list"><div class="loading">Cargando…</div></div>
</section>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Producto</div>
    <div class="grid">
      <div class="field">
        <label>Producto</label>
        <input class="txt" id="mNombre" placeholder="Ej. Jarabe natural">
      </div>
      <div class="field">
        <label>Unidad</label>
        <select class="sel" id="mUnidadSelect" onchange="onUnitSelect()">
          <option value="kg">kg</option>
          <option value="g">g</option>
          <option value="pza">pza</option>
          <option value="L">L</option>
          <option value="mL">mL</option>
          <option value="bolsa">bolsa</option>
          <option value="caja">caja</option>
          <option value="botella">botella</option>
          <option value="bote">bote</option>
          <option value="otro">otro</option>
        </select>
      </div>
      <div class="field" id="mUnidadCustomWrap" style="display:none">
        <label>Unidad personalizada</label>
        <input class="txt" id="mUnidadCustom" placeholder="Ej. charola">
      </div>
      <div class="field" id="mCantidadWrap">
        <label>Cantidad inicial</label>
        <input class="txt" id="mCantidad" inputmode="decimal" placeholder="0">
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn-sm" style="flex:1" onclick="closeModal()">Cancelar</button>
      <button class="btn-sm" style="flex:2;background:var(--text);color:#111" id="btnModalSave" onclick="saveModal()">Guardar</button>
    </div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzQ3VGL57gj-GA0AfgTAL6djmdEJgQKYEnhtNnJbX0N1ei9MK1Tzfq-aRT2sykhCaM/exec';

let TOKEN = localStorage.getItem('token');
let USUARIO = null;
let DASHBOARD = { cocina:[], barra:[] };
let AUDITORIA = [];
let MODAL_MODE = 'add';
let EDITING = null;
let TARGET_SECCION = 'cocina';

(function init(){
  try { USUARIO = JSON.parse(localStorage.getItem('usuario') || '{}'); } catch(_) {}
  if (!TOKEN || !USUARIO || USUARIO.rol !== 'admin') {
    window.location.href = 'index.html';
    return;
  }
  document.getElementById('userLine').textContent = (USUARIO.nombre || 'Admin') + ' · control general';
  bootstrap();
})();

function logout(){
  localStorage.removeItem('token');
  localStorage.removeItem('usuario');
  window.location.href = 'index.html';
}

function showTab(name){
  ['cocina','barra','auditoria','alertas'].forEach(t => {
    document.getElementById('s' + cap(t)).classList.toggle('active', t === name);
    document.getElementById('t' + cap(t)).classList.toggle('active', t === name);
  });
}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function toast(msg, isErr=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (isErr ? 'err' : 'ok');
  setTimeout(() => t.className = 'toast', 2600);
}

async function api(payload){
  const r = await fetch(API, { method:'POST', body: JSON.stringify(payload) });
  const data = await r.json();
  if (!data.ok && String(data.error || '').toLowerCase().includes('sesión')) {
    logout();
    throw new Error('Sesión expirada');
  }
  return data;
}

async function bootstrap(){
  await Promise.all([loadDashboard(), loadAuditoria()]);
  buildAlerts();
}

// ────────────────────────────────────────────────────────────
//  DASHBOARD
// ────────────────────────────────────────────────────────────
async function loadDashboard(){
  document.getElementById('cocinaList').innerHTML = '<div class="loading">Cargando…</div>';
  document.getElementById('barraList').innerHTML = '<div class="loading">Cargando…</div>';

  try{
    const d = await api({ action:'getDashboardAdmin', token:TOKEN });
    DASHBOARD = d.dashboard || { cocina:[], barra:[] };
    renderArea('cocina');
    renderArea('barra');
  }catch(e){
    document.getElementById('cocinaList').innerHTML = '<div class="empty">Error.</div>';
    document.getElementById('barraList').innerHTML = '<div class="empty">Error.</div>';
  }
}

function renderArea(area){
  const list = document.getElementById(area + 'List');
  const items = DASHBOARD[area] || [];

  if (!items.length) {
    list.innerHTML = '<div class="empty">Sin productos.</div>';
    return;
  }

  let html = '';
  items.forEach(p => {
    const last = p.ultimoConteo;
    html += `
      <div class="card">
        <div class="title">${escapeHtml(p.nombre)}</div>
        <div class="meta">${escapeHtml(p.unidad)} · <span class="dot ${area}"></span>${area.toUpperCase()}</div>

        <div class="chips">
          <div class="chip">
            <div class="chip-l">Último conteo</div>
            <div class="chip-v">${last ? escapeHtml(String(last.cantidad)) + ' ' + escapeHtml(p.unidad) : '—'}</div>
          </div>
          <div class="chip">
            <div class="chip-l">Capturado por</div>
            <div class="chip-v" style="font-size:14px">${last ? escapeHtml(last.usuarioNombre) : 'Sin captura'}</div>
          </div>
        </div>

        <div class="meta" style="margin-top:12px">
          ${last ? `${escapeHtml(last.fecha)} · ${escapeHtml(last.hora)}` : 'Todavía sin conteo'}
        </div>

        ${last && last.nota ? `<div class="meta" style="margin-top:10px;color:#cfcfcf">${escapeHtml(last.nota)}</div>` : ''}
        ${last && last.fotoUrl ? `<div style="margin-top:12px"><a class="btn-sm" style="display:inline-block;text-decoration:none" target="_blank" href="${last.fotoUrl}">VER FOTO</a></div>` : ''}

        <div class="cat-actions">
          <button class="pill" onclick="openEditModal('${p.id}','${esc(p.nombre)}','${esc(p.unidad)}','${area}')">Editar</button>
          <button class="pill off" onclick="toggleProducto('${p.id}', false)">Desactivar</button>
        </div>
      </div>`;
  });
  list.innerHTML = html;
}

// ────────────────────────────────────────────────────────────
//  AUDITORÍA
// ────────────────────────────────────────────────────────────
async function loadAuditoria(){
  const list = document.getElementById('auditList');
  list.innerHTML = '<div class="loading">Cargando…</div>';

  try{
    const d = await api({ action:'getAuditoria', token:TOKEN, limit:120 });
    AUDITORIA = d.auditoria || [];
    renderAuditoria();
  }catch(e){
    list.innerHTML = '<div class="empty">No se pudo cargar.</div>';
  }
}

function renderAuditoria(){
  const list = document.getElementById('auditList');
  if (!AUDITORIA.length) {
    list.innerHTML = '<div class="empty">Sin movimientos recientes.</div>';
    return;
  }

  let html = '';
  AUDITORIA.forEach(a => {
    html += `
      <div class="audit">
        <div class="audit-top">
          <div>
            <div class="title" style="font-size:22px">${escapeHtml(a.usuarioNombre)}</div>
            <div class="meta">${escapeHtml(a.timestamp ? new Date(a.timestamp).toLocaleString('es-MX') : '')} · ${escapeHtml((a.seccion || '').toUpperCase())}</div>
          </div>
          <div class="audit-action">${escapeHtml(a.accion)}</div>
        </div>
        <div class="meta" style="margin-top:10px">${escapeHtml(a.entidad)} · ${escapeHtml(a.entidadId)}</div>
        <div class="audit-detail">${prettyJson(a.detalle)}</div>
      </div>`;
  });
  list.innerHTML = html;
}

function prettyJson(raw){
  try{
    const obj = JSON.parse(raw || '{}');
    return escapeHtml(JSON.stringify(obj, null, 2));
  }catch(_){
    return escapeHtml(String(raw || ''));
  }
}

// ────────────────────────────────────────────────────────────
//  ALERTAS
// ────────────────────────────────────────────────────────────
function buildAlerts(){
  const list = document.getElementById('alertList');
  const alerts = [];

  ['cocina','barra'].forEach(area => {
    (DASHBOARD[area] || []).forEach(p => {
      if (!p.ultimoConteo) {
        alerts.push({
          area,
          titulo: p.nombre,
          valor: 'Sin conteo todavía',
          detalle: 'Producto activo sin captura registrada'
        });
      } else {
        const ts = new Date(p.ultimoConteo.timestamp || 0).getTime();
        const hours = (Date.now() - ts) / 36e5;
        if (hours > 24) {
          alerts.push({
            area,
            titulo: p.nombre,
            valor: 'Conteo viejo',
            detalle: 'Último conteo con más de 24 horas'
          });
        }
      }
    });
  });

  if (!alerts.length) {
    list.innerHTML = '<div class="empty">Sin alertas rápidas por ahora.</div>';
    return;
  }

  let html = '';
  alerts.forEach(a => {
    html += `
      <div class="alert">
        <div class="alert-top">
          <div>
            <div class="title" style="font-size:22px">${escapeHtml(a.titulo)}</div>
            <div class="meta">${escapeHtml(a.detalle)}</div>
          </div>
          <div class="tag ${a.area}">${a.area}</div>
        </div>
        <div class="alert-val">${escapeHtml(a.valor)}</div>
      </div>`;
  });
  list.innerHTML = html;
}

// ────────────────────────────────────────────────────────────
//  MODAL / PRODUCTOS
// ────────────────────────────────────────────────────────────
function onUnitSelect(){
  document.getElementById('mUnidadCustomWrap').style.display =
    document.getElementById('mUnidadSelect').value === 'otro' ? 'block' : 'none';
}

function openAddModal(seccion){
  MODAL_MODE = 'add';
  TARGET_SECCION = seccion;
  EDITING = null;
  document.getElementById('modalTitle').textContent = 'Nuevo producto · ' + seccion.toUpperCase();
  document.getElementById('mNombre').value = '';
  document.getElementById('mCantidad').value = '';
  document.getElementById('mUnidadSelect').value = 'kg';
  document.getElementById('mUnidadCustom').value = '';
  document.getElementById('mUnidadCustomWrap').style.display = 'none';
  document.getElementById('mCantidadWrap').style.display = 'block';
  document.getElementById('btnModalSave').textContent = 'Guardar';
  document.getElementById('modalBg').classList.add('open');
}

function openEditModal(id, nombre, unidad, seccion){
  MODAL_MODE = 'edit';
  TARGET_SECCION = seccion;
  EDITING = { id };
  document.getElementById('modalTitle').textContent = 'Editar producto';
  document.getElementById('mNombre').value = nombre;
  document.getElementById('mCantidad').value = '';
  const preset = ['kg','g','pza','L','mL','bolsa','caja','botella','bote'];
  if (preset.includes(unidad)) {
    document.getElementById('mUnidadSelect').value = unidad;
    document.getElementById('mUnidadCustomWrap').style.display = 'none';
    document.getElementById('mUnidadCustom').value = '';
  } else {
    document.getElementById('mUnidadSelect').value = 'otro';
    document.getElementById('mUnidadCustomWrap').style.display = 'block';
    document.getElementById('mUnidadCustom').value = unidad;
  }
  document.getElementById('mCantidadWrap').style.display = 'none';
  document.getElementById('btnModalSave').textContent = 'Actualizar';
  document.getElementById('modalBg').classList.add('open');
}

function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
}

async function saveModal(){
  const nombre = document.getElementById('mNombre').value.trim();
  const unitSel = document.getElementById('mUnidadSelect').value;
  const unidad = unitSel === 'otro'
    ? document.getElementById('mUnidadCustom').value.trim()
    : unitSel;

  if (!nombre) return toast('Escribe el nombre del producto', true);
  if (!unidad) return toast('Escribe la unidad', true);

  const btn = document.getElementById('btnModalSave');
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Guardando…';

  try{
    if (MODAL_MODE === 'add') {
      const cantidadInicial = Number(String(document.getElementById('mCantidad').value || '').replace(',', '.'));
      if (!isFinite(cantidadInicial) || cantidadInicial < 0) {
        toast('Cantidad inicial inválida', true);
        btn.disabled = false;
        btn.textContent = original;
        return;
      }
      const d = await api({
        action:'addProductoRapido',
        token:TOKEN,
        seccion:TARGET_SECCION,
        nombre,
        unidad,
        cantidadInicial
      });
      if (!d.ok) throw new Error(d.error || 'Error');
      toast('Producto agregado');
    } else {
      const d = await api({
        action:'editProducto',
        token:TOKEN,
        id: EDITING.id,
        nombre,
        unidad
      });
      if (!d.ok) throw new Error(d.error || 'Error');
      toast('Producto actualizado');
    }

    closeModal();
    await Promise.all([loadDashboard(), loadAuditoria()]);
    buildAlerts();
  }catch(e){
    toast(e.message || 'No se pudo guardar', true);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

async function toggleProducto(id, activo){
  const ok = confirm(activo ? '¿Activar producto?' : '¿Desactivar producto?');
  if (!ok) return;

  try{
    const d = await api({ action:'toggleProducto', token:TOKEN, id, activo });
    if (!d.ok) throw new Error(d.error || 'Error');
    toast(activo ? 'Producto activado' : 'Producto desactivado');
    await Promise.all([loadDashboard(), loadAuditoria()]);
    buildAlerts();
  }catch(e){
    toast(e.message || 'No se pudo cambiar el estado', true);
  }
}

function escapeHtml(str){
  return String(str ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#39;");
}
function esc(str){ return escapeHtml(str); }

document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target.id === 'modalBg') closeModal();
});
</script>
</body>
</html>
