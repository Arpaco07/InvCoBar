<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Inventario</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#080808;color:#e8e4dc;font-family:'Space Mono',monospace;min-height:100vh}
  header{background:#0e0e0e;border-bottom:1px solid #1c1c1c;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
  .hl{display:flex;align-items:center;gap:12px}
  .hlogo{width:32px;height:32px;object-fit:contain}
  .htitle{font-size:11px;font-weight:700;letter-spacing:3px}
  .hsub{font-size:10px;color:#555;letter-spacing:1px;margin-top:2px}
  .badge-admin{font-size:9px;font-weight:700;letter-spacing:2px;padding:5px 12px;border-radius:20px;background:#140e1e;color:#c084fc;border:1px solid #2e1a50}
  nav{display:flex;background:#0e0e0e;border-bottom:1px solid #1c1c1c;overflow-x:auto}
  .tab{flex-shrink:0;flex:1;padding:13px 8px;text-align:center;font-size:10px;letter-spacing:1px;color:#444;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;text-transform:uppercase;white-space:nowrap}
  .tab.active{color:#e8e4dc;border-bottom-color:#e8e4dc}
  .screen{display:none;padding:16px 20px}
  .screen.active{display:block}
  .sec-label{font-size:10px;letter-spacing:3px;color:#555;text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:8px}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.cocina{background:#3ecf8e}.dot.barra{background:#e05555}
  .prod-row{background:#0e0e0e;border:1px solid #1a1a1a;border-radius:14px;padding:16px;margin-bottom:10px}
  .prod-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
  .prod-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:400;letter-spacing:1px}
  .prod-last{font-size:10px;color:#444;text-align:right;letter-spacing:1px;line-height:1.6}
  .chips{display:flex;gap:8px}
  .chip{flex:1;background:#080808;border:1px solid #1a1a1a;border-radius:10px;padding:10px 8px;text-align:center}
  .clabel{font-size:9px;color:#444;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
  .cval{font-size:19px;font-weight:700}
  .cval.pos{color:#3ecf8e}.cval.neg{color:#e05555}.cval.neu{color:#888}.cval.none{color:#2a2a2a}
  .esp-row{display:flex;align-items:center;gap:8px;margin-top:12px}
  .esp-label{font-size:9px;color:#444;letter-spacing:2px;white-space:nowrap}
  .esp-input{flex:1;background:#080808;border:1px solid #1a1a1a;border-radius:8px;color:#e8e4dc;font-family:'Space Mono',monospace;font-size:14px;padding:8px 10px;text-align:center;-moz-appearance:textfield}
  .esp-input::-webkit-inner-spin-button{-webkit-appearance:none}
  .esp-input:focus{outline:none;border-color:#2a2a2a}
  .btn-sm{padding:8px 14px;background:#141414;border:1px solid #1e1e1e;border-radius:8px;color:#666;font-size:9px;letter-spacing:2px;cursor:pointer;white-space:nowrap;transition:all .15s}
  .btn-sm:active{background:#1e1e1e;color:#e8e4dc}
  .nota-bubble{margin-top:10px;padding:8px 12px;background:#080808;border-left:2px solid #1e1e1e;border-radius:4px;font-size:13px;color:#555;font-family:'Cormorant Garamond',serif;font-style:italic}
  .foto-link{margin-top:8px}
  .foto-link a{font-size:10px;color:#888;letter-spacing:1px;text-decoration:none;border:1px solid #1e1e1e;padding:4px 10px;border-radius:6px}
  .foto-link a:hover{color:#e8e4dc}
  .filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .f-btn{padding:6px 16px;background:#0e0e0e;border:1px solid #1e1e1e;border-radius:20px;color:#555;font-size:10px;letter-spacing:2px;cursor:pointer;font-family:'Space Mono',monospace;transition:all .15s}
  .f-btn.active{background:#e8e4dc;color:#080808;border-color:#e8e4dc}
  .hist-row{background:#0e0e0e;border:1px solid #1a1a1a;border-radius:12px;padding:12px 16px;margin-bottom:7px;display:flex;align-items:center;gap:12px}
  .hdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .hbody{flex:1;min-width:0}
  .hline1{display:flex;align-items:center;justify-content:space-between}
  .hproduct{font-family:'Cormorant Garamond',serif;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hqty{font-size:16px;font-weight:700;flex-shrink:0;margin-left:8px}
  .hmeta{font-size:10px;color:#444;letter-spacing:1px;margin-top:4px}
  .hnota{font-size:12px;color:#555;font-style:italic;font-family:'Cormorant Garamond',serif;margin-top:4px}
  .hfoto{margin-top:6px}
  .hfoto a{font-size:10px;color:#888;letter-spacing:1px;text-decoration:none;border:1px solid #1e1e1e;padding:3px 8px;border-radius:6px}
  /* Catálogo */
  .cat-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
  .btn-add{padding:10px 18px;background:#e8e4dc;color:#080808;border:none;border-radius:10px;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:2px;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .btn-add:active{background:#ccc8c0}
  .cat-row{background:#0e0e0e;border:1px solid #1a1a1a;border-radius:12px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
  .cat-row.inactive{opacity:.4}
  .cat-info{flex:1;min-width:0}
  .cat-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:400}
  .cat-meta{font-size:10px;color:#555;letter-spacing:1px;margin-top:3px}
  .cat-sec{font-size:9px;font-weight:700;letter-spacing:2px;padding:3px 8px;border-radius:10px;text-transform:uppercase;flex-shrink:0}
  .cat-sec.cocina{background:#0a1f14;color:#3ecf8e;border:1px solid #153a22}
  .cat-sec.barra{background:#1a0a10;color:#e05555;border:1px solid #3a1520}
  .cat-sec.ambas{background:#14100e;color:#c084fc;border:1px solid #2e1a50}
  .cat-actions{display:flex;gap:6px;flex-shrink:0}
  .btn-edit{padding:6px 12px;background:#141414;border:1px solid #1e1e1e;border-radius:8px;color:#888;font-size:10px;cursor:pointer;transition:all .15s}
  .btn-edit:active{background:#1e1e1e;color:#e8e4dc}
  .btn-del{padding:6px 12px;background:#1a0808;border:1px solid #2a1010;border-radius:8px;color:#c94444;font-size:10px;cursor:pointer}
  .btn-restore{padding:6px 12px;background:#0a1f14;border:1px solid #153a22;border-radius:8px;color:#3ecf8e;font-size:10px;cursor:pointer}
  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-bg.open{opacity:1;pointer-events:all}
  .modal{background:#0e0e0e;border:1px solid #1c1c1c;border-radius:20px 20px 0 0;padding:28px 24px 48px;width:100%;max-width:480px;transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
  .modal-bg.open .modal{transform:translateY(0)}
  .modal-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;letter-spacing:2px;margin-bottom:24px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:10px;letter-spacing:2px;color:#555;text-transform:uppercase;margin-bottom:8px}
  .field input{width:100%;background:#080808;border:1px solid #1e1e1e;border-radius:10px;color:#e8e4dc;font-family:'Space Mono',monospace;font-size:14px;padding:12px 14px;transition:border-color .2s}
  .field input:focus{outline:none;border-color:#333}
  /* Unidad como chips */
  .unit-chips{display:flex;gap:8px;flex-wrap:wrap}
  .unit-chip{padding:10px 18px;background:#141414;border:1px solid #1e1e1e;border-radius:10px;color:#666;font-size:11px;letter-spacing:2px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
  .unit-chip.selected{background:#1e1e1e;border-color:#444;color:#e8e4dc}
  .unit-custom{margin-top:10px;display:none}
  /* Sección chips */
  .sec-chips{display:flex;gap:8px}
  .sec-chip{flex:1;padding:12px 8px;background:#141414;border:1px solid #1e1e1e;border-radius:10px;color:#666;font-size:10px;letter-spacing:2px;cursor:pointer;text-align:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
  .sec-chip.selected.cocina{background:#0a1f14;color:#3ecf8e;border-color:#153a22}
  .sec-chip.selected.barra{background:#1a0a10;color:#e05555;border-color:#3a1520}
  .sec-chip.selected.ambas{background:#14100e;color:#c084fc;border-color:#2e1a50}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .btn-cancel{flex:1;padding:14px;background:#141414;border:1px solid #1e1e1e;border-radius:12px;color:#666;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;cursor:pointer}
  .btn-save{flex:2;padding:14px;background:#e8e4dc;color:#080808;border:none;border-radius:12px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:3px;cursor:pointer}
  .btn-save:active{background:#ccc8c0}
  .btn-cancel:active{background:#1e1e1e}
  .empty{text-align:center;color:#222;font-size:10px;padding:60px 0;letter-spacing:3px}
  .loading{text-align:center;padding:60px 0;color:#333;font-size:11px;letter-spacing:3px}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;font-size:10px;letter-spacing:2px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .toast.ok{background:#0a1f14;border:1px solid #153a22;color:#3ecf8e;opacity:1}
  .toast.err{background:#1a0a10;border:1px solid #3a1520;color:#e05555;opacity:1}
  .toast.hide{opacity:0}
</style>
</head>

        <div class="sec-chip ambas"           id="sc_ambas"  onclick="selSec('ambas')">AMBAS</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">CANCELAR</button>
      <button class="btn-save"   onclick="guardarProducto()">GUARDAR</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var API     = 'https://script.google.com/macros/s/AKfycbzQ3VGL57gj-GA0AfgTAL6djmdEJgQKYEnhtNnJbX0N1ei9MK1Tzfq-aRT2sykhCaM/exec';
var TOKEN   = localStorage.getItem('token')   || '';
var USUARIO = JSON.parse(localStorage.getItem('usuario') || '{}');
var HF = 'all', CF = 'all';
var HIST_DATA = [], CAT_DATA = [];
var editingId = null;
var mUnidad = 'kilo', mSeccion = 'cocina';

if (!TOKEN || USUARIO.rol !== 'admin') { window.location.href = 'index.html'; }
else { loadDashboard(); loadHistorial(); loadCatalogo(); }

// ── DASHBOARD ──────────────────────────────────────────────
async function loadDashboard() {
  try {
    var r    = await fetch(API, { method:'POST', body: JSON.stringify({ action:'getDashboard', token:TOKEN }) });
    var data = await r.json();
    if (!data.ok) { toast(data.error||'Error', true); return; }
    renderSec('cocina', data.cocina||[], 'lCocina');
    renderSec('barra',  data.barra||[],  'lBarra');
  } catch(e) { toast('Error al cargar', true); }
}
function renderSec(sec, items, cid) {
  var el = document.getElementById(cid);
  if (!items.length) { el.innerHTML = '<div class="empty">SIN PRODUCTOS</div>'; return; }
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var p   = items[i];
    var dif = p.diferencia;
    var dc  = dif===null?'none':(dif>0?'pos':(dif<0?'neg':'neu'));
    var ds  = dif===null?'—':(dif>0?'+'+dif:String(dif));
    html += '<div class="prod-row">' +
      '<div class="prod-top"><span class="prod-name">'+p.nombre+'</span>' +
      '<span class="prod-last">'+(p.fecha?p.fecha+'<br>'+(p.usuario||''):'Sin conteo')+'</span></div>' +
      '<div class="chips">' +
        '<div class="chip"><div class="clabel">Esperado</div><div class="cval neu">'+(p.esperado!==null?p.esperado:'—')+'</div></div>' +
        '<div class="chip"><div class="clabel">Real</div><div class="cval '+(p.actual!==null?'neu':'none')+'">'+(p.actual!==null?p.actual+' '+p.unidad:'—')+'</div></div>' +
        '<div class="chip"><div class="clabel">Dif.</div><div class="cval '+dc+'">'+ds+'</div></div>' +
      '</div>' +
      '<div class="esp-row"><span class="esp-label">FIJAR ESP.</span>' +
      '<input class="esp-input" type="number" id="ei_'+sec+'_'+i+'" min="0" step="0.1" value="'+(p.esperado!==null?p.esperado:'')+'" placeholder="—">' +
      '<button class="btn-sm" onclick="setEsp(\''+sec+'\','+i+',\''+p.id+'\',\''+p.nombre+'\')">GUARDAR</button></div>' +
      (p.nota  ? '<div class="nota-bubble">'+p.nota+'</div>' : '') +
      (p.fotoUrl ? '<div class="foto-link"><a href="'+p.fotoUrl+'" target="_blank">VER FOTO →</a></div>' : '') +
    '</div>';
  }
  el.innerHTML = html;
}
async function setEsp(sec, idx, pid, pnom) {
  var val = parseFloat(document.getElementById('ei_'+sec+'_'+idx).value);
  if (isNaN(val)) { toast('Número inválido', true); return; }
  try {
    var r = await fetch(API, { method:'POST', body: JSON.stringify({ action:'setEsperado', token:TOKEN, productoId:pid, productoNombre:pnom, seccion:sec, cantidad:val }) });
    var d = await r.json(); toast(d.ok?'✓ Actualizado':d.error||'Error', !d.ok);
  } catch(e) { toast('Error', true); }
}

// ── HISTORIAL ──────────────────────────────────────────────
async function loadHistorial() {
  try {
    var r = await fetch(API, { method:'POST', body: JSON.stringify({ action:'getHistorialAdmin', token:TOKEN }) });
    var d = await r.json();
    if (d.ok) { HIST_DATA = d.historial||[]; renderHist(); }
  } catch(e) {}
}
function renderHist() {
  var el = document.getElementById('lHistorial');
  var items = HF==='all' ? HIST_DATA : HIST_DATA.filter(function(h){ return h.seccion===HF; });
  if (!items.length) { el.innerHTML = '<div class="empty">SIN REGISTROS</div>'; return; }
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var h = items[i];
    html += '<div class="hist-row">' +
      '<div class="hdot" style="background:'+(h.seccion==='cocina'?'#3ecf8e':'#e05555')+'"></div>' +
      '<div class="hbody">' +
        '<div class="hline1"><span class="hproduct">'+h.producto+'</span><span class="hqty">'+h.cantidad+'</span></div>' +
        '<div class="hmeta">'+h.fecha+' '+h.hora+' · '+h.usuario+'</div>' +
        (h.nota   ? '<div class="hnota">'+h.nota+'</div>' : '') +
        (h.fotoUrl? '<div class="hfoto"><a href="'+h.fotoUrl+'" target="_blank">VER FOTO →</a></div>' : '') +
      '</div></div>';
  }
  el.innerHTML = html;
}
function filtrar(f) {
  HF = f;
  ['All','Cocina','Barra'].forEach(function(x){ document.getElementById('f'+x).classList.toggle('active', f===(x==='All'?'all':x.toLowerCase())); });
  renderHist();
}

// ── CATÁLOGO ───────────────────────────────────────────────
async function loadCatalogo() {
  try {
    var r = await fetch(API, { method:'POST', body: JSON.stringify({ action:'getCatalogoAdmin', token:TOKEN }) });
    var d = await r.json();
    if (d.ok) { CAT_DATA = d.catalogo||[]; renderCatalogo(); }
  } catch(e) {}
}
function renderCatalogo() {
  var el = document.getElementById('lCatalogo');
  var items = CF==='all' ? CAT_DATA : CAT_DATA.filter(function(p){ return p.seccion===CF; });
  if (!items.length) { el.innerHTML = '<div class="empty">SIN PRODUCTOS</div>'; return; }
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var p = items[i];
    html += '<div class="cat-row'+(p.activo?'':' inactive')+'">' +
      '<div class="cat-info">' +
        '<div class="cat-name">'+p.nombre+'</div>' +
        '<div class="cat-meta">'+p.unidad+'</div>' +
      '</div>' +
      '<span class="cat-sec '+p.seccion+'">'+p.seccion+'</span>' +
      '<div class="cat-actions">' +
        '<button class="btn-edit" onclick="abrirModal(\''+p.id+'\',\''+esc(p.nombre)+'\',\''+esc(p.unidad)+'\',\''+p.seccion+'\')">EDITAR</button>' +
        (p.activo ? '<button class="btn-del"     onclick="toggleActivo(\''+p.id+'\',false)">OFF</button>'
                  : '<button class="btn-restore" onclick="toggleActivo(\''+p.id+'\',true)">ON</button>') +
      '</div></div>';
  }
  el.innerHTML = html;
}
function esc(s){ return String(s).replace(/'/g,"&#39;"); }
function filtrarCat(f) {
  CF = f;
  ['All','Cocina','Barra','Ambas'].forEach(function(x){ document.getElementById('cf'+x).classList.toggle('active', f===(x==='All'?'all':x.toLowerCase())); });
  renderCatalogo();
}

// ── MODAL ──────────────────────────────────────────────────
var UNIDADES_PRESET = ['kilo','pieza','bolsa','caja','litro'];

function abrirModal(id, nombre, unidad, seccion) {
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? 'Editar producto' : 'Agregar producto';
  document.getElementById('mNombre').value = nombre || '';
  // Unidad
  var isPreset = UNIDADES_PRESET.indexOf((unidad||'kilo').toLowerCase()) !== -1;
  var uVal = isPreset ? (unidad||'kilo').toLowerCase() : 'otro';
  selUnit(uVal, null, unidad);
  // Sección
  selSec(seccion || 'cocina');
  document.getElementById('modalBg').classList.add('open');
  setTimeout(function(){ document.getElementById('mNombre').focus(); }, 300);
}
function selUnit(val, el, customVal) {
  mUnidad = val;
  document.querySelectorAll('.unit-chip').forEach(function(c){ c.classList.remove('selected'); });
  if (el) { el.classList.add('selected'); }
  else {
    document.querySelectorAll('.unit-chip').forEach(function(c){
      if (c.textContent.toLowerCase() === val.toUpperCase().toLowerCase() ||
          (val === 'otro' && c.textContent === 'OTRO')) c.classList.add('selected');
    });
  }
  var customDiv = document.getElementById('unitCustomDiv');
  customDiv.style.display = val === 'otro' ? 'block' : 'none';
  if (val === 'otro' && customVal) document.getElementById('mUnidadCustom').value = customVal;
}
function selSec(val) {
  mSeccion = val;
  ['cocina','barra','ambas'].forEach(function(s){
    document.getElementById('sc_'+s).classList.toggle('selected', s===val);
  });
}
function cerrarModal() { document.getElementById('modalBg').classList.remove('open'); editingId = null; }
function cerrarModalBg(e) { if (e.target === document.getElementById('modalBg')) cerrarModal(); }

async function guardarProducto() {
  var nombre = document.getElementById('mNombre').value.trim();
  if (!nombre) { toast('Escribe el nombre del producto', true); return; }
  var unidad = mUnidad === 'otro' ? document.getElementById('mUnidadCustom').value.trim() : mUnidad;
  if (!unidad) { toast('Selecciona o escribe la unidad', true); return; }
  var payload = editingId
    ? { action:'editProducto',  token:TOKEN, id:editingId, nombre:nombre, unidad:unidad, seccion:mSeccion }
    : { action:'addProducto',   token:TOKEN, nombre:nombre, unidad:unidad, seccion:mSeccion };
  try {
    var r = await fetch(API, { method:'POST', body: JSON.stringify(payload) });
    var d = await r.json();
    if (d.ok) {
      toast(editingId ? '✓ Producto actualizado' : '✓ Producto agregado');
      cerrarModal(); await loadCatalogo();
    } else { toast(d.error||'Error', true); }
  } catch(e) { toast('Error de conexión', true); }
}
async function toggleActivo(id, activo) {
  try {
    var payload = activo
      ? { action:'editProducto', token:TOKEN, id:id, activo:true }
      : { action:'deleteProducto', token:TOKEN, id:id };
    var r = await fetch(API, { method:'POST', body: JSON.stringify(payload) });
    var d = await r.json();
    if (d.ok) { toast(activo?'✓ Activado':'✓ Desactivado'); await loadCatalogo(); }
    else { toast(d.error||'Error', true); }
  } catch(e) { toast('Error', true); }
}

// ── NAVEGACIÓN ─────────────────────────────────────────────
function showTab(name) {
  ['cocina','barra','historial','catalogo'].forEach(function(t) {
    document.getElementById('s'+cap(t)).classList.toggle('active', t===name);
    document.getElementById('t'+cap(t)).classList.toggle('active', t===name);
  });
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function toast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast '+(isErr?'err':'ok');
  setTimeout(function(){ t.className='toast hide'; }, 3000);
}
</script>
</body>
</html>
