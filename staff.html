<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pares 84×88 — Área</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap');
  :root{
    --bg:#090909;--panel:#111;--line:#1d1d1d;--text:#e8e4dc;--muted:#777;--soft:#151515;
    --ok:#3ecf8e;--err:#e05555;--cocina:#3ecf8e;--barra:#e05555;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;padding-bottom:100px}
  header{
    position:sticky;top:0;z-index:20;background:rgba(9,9,9,.96);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center
  }
  .head-left{display:flex;gap:12px;align-items:center}
  .logo{
    width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#111;
    border:1px solid #262626;font-family:'Cormorant Garamond',serif;font-size:15px
  }
  .tt{font-size:11px;letter-spacing:3px;font-weight:700}
  .uu{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:3px}
  .badge{
    font-size:9px;font-weight:700;letter-spacing:2px;border-radius:999px;padding:7px 12px;border:1px solid
  }
  .badge.cocina{color:var(--cocina);background:#0c1c14;border-color:#19402b}
  .badge.barra{color:var(--barra);background:#1b0d0d;border-color:#4a1d1d}
  nav{display:flex;background:#0f0f0f;border-bottom:1px solid var(--line)}
  .tab{
    flex:1;padding:13px 6px;text-align:center;font-size:10px;letter-spacing:1px;color:#5e5e5e;
    text-transform:uppercase;border-bottom:2px solid transparent;cursor:pointer
  }
  .tab.active{color:var(--text);border-bottom-color:var(--text)}
  .screen{display:none;padding:18px 16px}
  .screen.active{display:block}
  .row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
  .label{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
  .btn-sm,.btn-main,.chip,.icon-btn{
    border:none;cursor:pointer;font-family:'Space Mono',monospace
  }
  .btn-sm{
    padding:10px 14px;border-radius:12px;background:var(--soft);color:var(--text);
    border:1px solid #262626;font-size:10px;letter-spacing:2px
  }
  .catalog-list,.hist-list{display:grid;gap:10px}
  .product-card,.cat-card,.hist-card,.panel{
    background:var(--panel);border:1px solid var(--line);border-radius:18px
  }
  .product-card{padding:16px}
  .ptop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
  .pname,.cat-name,.hist-name{
    font-family:'Cormorant Garamond',serif;font-size:22px;line-height:1.05
  }
  .unit{
    flex-shrink:0;padding:5px 10px;border-radius:999px;border:1px solid #2a2a2a;color:#8e8e8e;font-size:9px;letter-spacing:2px;text-transform:uppercase
  }
  .qty-row{display:flex;gap:8px;align-items:center}
  .qty{
    flex:1;background:#0b0b0b;border:1px solid #252525;border-radius:14px;color:var(--text);
    padding:13px 12px;font-size:24px;font-weight:700;text-align:center;font-family:'Space Mono',monospace
  }
  .qty:focus,.txt:focus,.sel:focus,.note:focus{outline:none;border-color:#505050}
  .qty-unit{font-size:11px;color:#666;letter-spacing:1px;min-width:42px}
  .extras{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .icon-btn{
    padding:8px 12px;border-radius:10px;background:var(--soft);color:#8f8f8f;border:1px solid #262626;font-size:10px;letter-spacing:1px
  }
  .icon-btn.active{color:var(--text);border-color:#484848}
  .note{display:none;width:100%;margin-top:8px;background:#0b0b0b;border:1px solid #252525;border-radius:12px;color:var(--text);padding:10px 12px;resize:none;font-family:'Cormorant Garamond',serif;font-size:16px}
  .file{display:none}
  .photo-box{display:none;margin-top:8px;position:relative}
  .photo-box img{width:100%;max-height:170px;object-fit:cover;border-radius:12px;border:1px solid #262626}
  .xbtn{
    position:absolute;top:8px;right:8px;background:rgba(0,0,0,.75);color:var(--err);
    border:1px solid #4a1d1d;border-radius:8px;padding:5px 8px;font-size:10px
  }
  .photo-state{margin-top:6px;font-size:10px;letter-spacing:1px}
  .photo-state.ok{color:var(--ok)} .photo-state.err{color:var(--err)} .photo-state.loading{color:#999}
  .savebar{
    position:fixed;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(to top, rgba(9,9,9,1), rgba(9,9,9,.82))
  }
  .btn-main{
    width:min(720px,100%);display:block;margin:0 auto;padding:18px;border-radius:16px;background:var(--text);color:#111;
    font-size:11px;font-weight:700;letter-spacing:4px
  }
  .btn-main:disabled{opacity:.35;cursor:not-allowed}
  .panel{padding:16px}
  .grid{display:grid;gap:12px}
  .field label{display:block;margin-bottom:7px;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
  .txt,.sel{
    width:100%;background:#0b0b0b;border:1px solid #252525;border-radius:14px;color:var(--text);padding:14px 14px;font-size:15px
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    padding:10px 14px;border-radius:12px;background:#141414;border:1px solid #262626;color:#8e8e8e;font-size:10px;letter-spacing:2px
  }
  .chip.active{color:var(--text);border-color:#585858;background:#191919}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cat-card,.hist-card{padding:14px}
  .cat-meta,.hist-meta{font-size:10px;color:#777;letter-spacing:1px;margin-top:4px}
  .cat-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pill{
    padding:8px 10px;border-radius:10px;font-size:10px;letter-spacing:1px;border:1px solid #2a2a2a;background:#151515;color:#d0d0d0
  }
  .pill.off{color:var(--err);border-color:#4a1d1d;background:#1b0d0d}
  .pill.on{color:var(--ok);border-color:#19402b;background:#0c1c14}
  .hist-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .hist-qty{font-size:18px;font-weight:700;white-space:nowrap}
  .hist-photo a{display:inline-block;margin-top:8px;color:#cfcfcf;text-decoration:none;border:1px solid #2b2b2b;padding:6px 10px;border-radius:10px;font-size:10px}
  .empty,.loading{
    text-align:center;padding:60px 16px;color:#444;font-size:11px;letter-spacing:3px
  }
  .toast{
    position:fixed;top:82px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:12px;font-size:10px;
    letter-spacing:2px;z-index:30;opacity:0;pointer-events:none;transition:.2s
  }
  .toast.show{opacity:1}
  .toast.ok{background:#0c1c14;border:1px solid #19402b;color:var(--ok)}
  .toast.err{background:#1b0d0d;border:1px solid #4a1d1d;color:var(--err)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
  .right-actions{display:flex;gap:8px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal-bg.open{display:flex}
  .modal{width:min(520px,100%);background:#111;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:22px 18px 24px}
  .modal-title{font-family:'Cormorant Garamond',serif;font-size:28px;margin-bottom:14px}
  @media (min-width:760px){
    .screen{max-width:900px;margin:0 auto}
    .catalog-list{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<header>
  <div class="head-left">
    <div class="logo">84×88</div>
    <div>
      <div class="tt">PARES 84×88</div>
      <div class="uu" id="userLine">Cargando…</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <span class="badge" id="areaBadge">ÁREA</span>
    <button class="btn-sm" onclick="logout()">SALIR</button>
  </div>
</header>

<nav>
  <div class="tab active" id="tConteo" onclick="showTab('conteo')">Conteo</div>
  <div class="tab" id="tCatalogo" onclick="showTab('catalogo')">Mi catálogo</div>
  <div class="tab" id="tHistorial" onclick="showTab('historial')">Historial</div>
</nav>

<section class="screen active" id="sConteo">
  <div class="row-head">
    <div class="label">Conteo de hoy</div>
    <div class="right-actions">
      <button class="btn-sm" onclick="loadCatalogo()">RECARGAR</button>
    </div>
  </div>
  <div id="productList" class="grid"><div class="loading">Cargando catálogo…</div></div>
</section>

<section class="screen" id="sCatalogo">
  <div class="toolbar">
    <div class="label">Catálogo del área</div>
    <button class="btn-sm" onclick="openAddModal()">+ Producto</button>
  </div>
  <div id="catalogList" class="catalog-list"><div class="loading">Cargando catálogo…</div></div>
</section>

<section class="screen" id="sHistorial">
  <div class="row-head">
    <div class="label">Últimos movimientos</div>
    <button class="btn-sm" onclick="loadHistorial()">RECARGAR</button>
  </div>
  <div id="histList" class="hist-list"><div class="loading">Cargando historial…</div></div>
</section>

<div class="savebar" id="savebar">
  <button class="btn-main" id="btnGuardar" onclick="guardarConteo()">GUARDAR CONTEO</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Nuevo producto</div>

    <div class="panel" style="padding:0;border:none;background:transparent">
      <div class="grid">
        <div class="field">
          <label>Producto</label>
          <input class="txt" id="mNombre" placeholder="Ej. Limón persa">
        </div>

        <div class="split">
          <div class="field">
            <label>Cantidad inicial</label>
            <input class="txt" id="mCantidad" inputmode="decimal" placeholder="0">
          </div>
          <div class="field">
            <label>Unidad</label>
            <select class="sel" id="mUnidadSelect" onchange="onUnitSelect()">
              <option value="kg">kg</option>
              <option value="g">g</option>
              <option value="pza">pza</option>
              <option value="L">L</option>
              <option value="mL">mL</option>
              <option value="bolsa">bolsa</option>
              <option value="caja">caja</option>
              <option value="botella">botella</option>
              <option value="bote">bote</option>
              <option value="otro">otro</option>
            </select>
          </div>
        </div>

        <div class="field" id="mUnidadCustomWrap" style="display:none">
          <label>Unidad personalizada</label>
          <input class="txt" id="mUnidadCustom" placeholder="Ej. charola">
        </div>
      </div>

      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn-sm" style="flex:1" onclick="closeModal()">Cancelar</button>
        <button class="btn-main" style="margin:0;flex:2" id="btnModalSave" onclick="saveModal()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzQ3VGL57gj-GA0AfgTAL6djmdEJgQKYEnhtNnJbX0N1ei9MK1Tzfq-aRT2sykhCaM/exec';

let TOKEN = localStorage.getItem('token');
let USUARIO = null;
let CATALOGO = [];
let HISTORIAL = [];
let FOTO_URLS = {};
let EDITING_PRODUCT = null;

(function init(){
  try { USUARIO = JSON.parse(localStorage.getItem('usuario') || '{}'); } catch(_) {}
  if (!TOKEN || !USUARIO || !USUARIO.rol || USUARIO.rol === 'admin') {
    window.location.href = 'index.html';
    return;
  }
  paintUser();
  bootstrap();
})();

function paintUser(){
  document.getElementById('userLine').textContent = (USUARIO.nombre || '') + ' · ' + (USUARIO.seccion || '').toUpperCase();
  const badge = document.getElementById('areaBadge');
  badge.textContent = (USUARIO.seccion || '').toUpperCase();
  badge.classList.add(USUARIO.seccion);
}

function logout(){
  localStorage.removeItem('token');
  localStorage.removeItem('usuario');
  window.location.href = 'index.html';
}

function showTab(name){
  ['conteo','catalogo','historial'].forEach(t => {
    document.getElementById('s' + cap(t)).classList.toggle('active', t === name);
    document.getElementById('t' + cap(t)).classList.toggle('active', t === name);
  });
  document.getElementById('savebar').style.display = name === 'conteo' ? '' : 'none';
}

function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function toast(msg, isErr=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (isErr ? 'err' : 'ok');
  setTimeout(() => t.className = 'toast', 2600);
}

async function api(payload){
  const r = await fetch(API, { method:'POST', body: JSON.stringify(payload) });
  const data = await r.json();
  if (!data.ok && String(data.error || '').toLowerCase().includes('sesión')) {
    logout();
    throw new Error('Sesión expirada');
  }
  return data;
}

async function bootstrap(){
  try{
    await Promise.all([loadCatalogo(), loadHistorial()]);
  }catch(e){
    toast('No se pudo cargar el sistema', true);
  }
}

// ────────────────────────────────────────────────────────────
//  CONTEO
// ────────────────────────────────────────────────────────────
async function loadCatalogo(){
  const list1 = document.getElementById('productList');
  const list2 = document.getElementById('catalogList');
  list1.innerHTML = '<div class="loading">Cargando catálogo…</div>';
  list2.innerHTML = '<div class="loading">Cargando catálogo…</div>';

  const data = await api({ action:'getCatalogoArea', token:TOKEN, seccion:USUARIO.seccion });
  CATALOGO = data.catalogo || [];
  renderConteo();
  renderCatalogo();
}

function renderConteo(){
  const list = document.getElementById('productList');
  if (!CATALOGO.length) {
    list.innerHTML = '<div class="empty">Sin productos en tu área.</div>';
    return;
  }

  let html = '';
  CATALOGO.forEach((p, i) => {
    html += `
      <div class="product-card" id="card_${i}">
        <div class="ptop">
          <div class="pname">${escapeHtml(p.nombre)}</div>
          <div class="unit">${escapeHtml(p.unidad)}</div>
        </div>

        <div class="qty-row">
          <input class="qty" id="qty_${i}" inputmode="decimal" placeholder="—" oninput="markCard(${i})">
          <div class="qty-unit">${escapeHtml(p.unidad)}</div>
        </div>

        <div class="extras">
          <button class="icon-btn" id="btnNote_${i}" onclick="toggleNote(${i})">+ Nota</button>
          <button class="icon-btn" id="btnPhoto_${i}" onclick="pickPhoto(${i})">📷 Foto</button>
        </div>

        <textarea class="note" id="note_${i}" rows="2" placeholder="Observación opcional"></textarea>

        <input class="file" id="file_${i}" type="file" accept="image/*" capture="environment" onchange="onPhotoSelected(${i},this)">
        <div class="photo-box" id="photoBox_${i}">
          <img id="photoImg_${i}" alt="">
          <button class="xbtn" onclick="removePhoto(${i})">✕</button>
        </div>
        <div class="photo-state" id="photoState_${i}"></div>
      </div>`;
  });
  list.innerHTML = html;
}

function markCard(i){
  const card = document.getElementById('card_' + i);
  const v = document.getElementById('qty_' + i).value.trim();
  card.style.borderColor = v ? '#505050' : '';
}

function toggleNote(i){
  const el = document.getElementById('note_' + i);
  const btn = document.getElementById('btnNote_' + i);
  const visible = el.style.display === 'block';
  el.style.display = visible ? 'none' : 'block';
  btn.classList.toggle('active', !visible);
  btn.textContent = visible ? '+ Nota' : '− Nota';
}

function pickPhoto(i){
  document.getElementById('file_' + i).click();
}

function onPhotoSelected(i, input){
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('photoImg_' + i).src = e.target.result;
    document.getElementById('photoBox_' + i).style.display = 'block';
    const btn = document.getElementById('btnPhoto_' + i);
    btn.classList.add('active');
    btn.textContent = '📷 ✓';
  };
  reader.readAsDataURL(file);
  compressAndUpload(i, file);
}

function compressAndUpload(i, file){
  setPhotoState(i, 'Subiendo foto…', 'loading');

  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height, maxW = 1100;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const b64 = c.toDataURL('image/jpeg', 0.78).split(',')[1];
      uploadPhoto(i, b64);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function uploadPhoto(i, b64){
  try{
    const d = await api({
      action:'subirFoto',
      token:TOKEN,
      base64:b64,
      mimeType:'image/jpeg',
      producto:CATALOGO[i].nombre
    });
    FOTO_URLS[i] = d.url;
    setPhotoState(i, '✓ Foto lista', 'ok');
  }catch(e){
    delete FOTO_URLS[i];
    setPhotoState(i, 'No se pudo subir', 'err');
  }
}

function setPhotoState(i, msg, cls){
  const el = document.getElementById('photoState_' + i);
  el.textContent = msg;
  el.className = 'photo-state ' + cls;
}

function removePhoto(i){
  delete FOTO_URLS[i];
  document.getElementById('file_' + i).value = '';
  document.getElementById('photoBox_' + i).style.display = 'none';
  document.getElementById('photoImg_' + i).src = '';
  const btn = document.getElementById('btnPhoto_' + i);
  btn.classList.remove('active');
  btn.textContent = '📷 Foto';
  setPhotoState(i, '', '');
}

async function guardarConteo(){
  const productos = [];

  CATALOGO.forEach((p, i) => {
    const qtyRaw = document.getElementById('qty_' + i)?.value.trim();
    if (!qtyRaw) return;
    const cantidad = Number(qtyRaw.replace(',', '.'));
    if (!isFinite(cantidad) || cantidad < 0) return;

    productos.push({
      id: p.id,
      nombre: p.nombre,
      unidad: p.unidad,
      cantidad,
      nota: (document.getElementById('note_' + i)?.value || '').trim(),
      fotoUrl: FOTO_URLS[i] || ''
    });
  });

  if (!productos.length) {
    toast('No capturaste cantidades', true);
    return;
  }

  const btn = document.getElementById('btnGuardar');
  btn.disabled = true;
  btn.textContent = 'GUARDANDO…';

  try{
    const d = await api({
      action:'guardarConteo',
      token:TOKEN,
      seccion:USUARIO.seccion,
      productos
    });
    toast(`✓ ${d.guardados} registro(s) guardados`);
    await loadHistorial();

    // limpiar cantidades después del guardado
    CATALOGO.forEach((_, i) => {
      const q = document.getElementById('qty_' + i);
      const n = document.getElementById('note_' + i);
      if (q) q.value = '';
      if (n) { n.value = ''; n.style.display = 'none'; }
      removePhoto(i);
      markCard(i);
      const b = document.getElementById('btnNote_' + i);
      if (b) { b.classList.remove('active'); b.textContent = '+ Nota'; }
    });
  } catch(e){
    toast('No se pudo guardar el conteo', true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'GUARDAR CONTEO';
  }
}

// ────────────────────────────────────────────────────────────
//  CATÁLOGO
// ────────────────────────────────────────────────────────────
function renderCatalogo(){
  const list = document.getElementById('catalogList');
  if (!CATALOGO.length) {
    list.innerHTML = '<div class="empty">Tu catálogo está vacío.</div>';
    return;
  }

  let html = '';
  CATALOGO.forEach(p => {
    html += `
      <div class="cat-card">
        <div class="cat-name">${escapeHtml(p.nombre)}</div>
        <div class="cat-meta">${escapeHtml(p.unidad)} · ${escapeHtml((p.seccion || '').toUpperCase())}</div>
        <div class="cat-actions">
          <button class="pill" onclick="openEditModal('${p.id}','${esc(p.nombre)}','${esc(p.unidad)}')">Editar</button>
          <button class="pill off" onclick="toggleProducto('${p.id}', false)">Desactivar</button>
        </div>
      </div>`;
  });
  list.innerHTML = html;
}

function openAddModal(){
  EDITING_PRODUCT = null;
  document.getElementById('modalTitle').textContent = 'Nuevo producto';
  document.getElementById('mNombre').value = '';
  document.getElementById('mCantidad').value = '';
  document.getElementById('mUnidadSelect').value = 'kg';
  document.getElementById('mUnidadCustom').value = '';
  document.getElementById('mUnidadCustomWrap').style.display = 'none';
  document.getElementById('btnModalSave').textContent = 'Guardar';
  document.getElementById('modalBg').classList.add('open');
}

function openEditModal(id, nombre, unidad){
  EDITING_PRODUCT = { id };
  document.getElementById('modalTitle').textContent = 'Editar producto';
  document.getElementById('mNombre').value = nombre;
  document.getElementById('mCantidad').value = '';
  const preset = ['kg','g','pza','L','mL','bolsa','caja','botella','bote'];
  if (preset.includes(unidad)) {
    document.getElementById('mUnidadSelect').value = unidad;
    document.getElementById('mUnidadCustomWrap').style.display = 'none';
    document.getElementById('mUnidadCustom').value = '';
  } else {
    document.getElementById('mUnidadSelect').value = 'otro';
    document.getElementById('mUnidadCustomWrap').style.display = 'block';
    document.getElementById('mUnidadCustom').value = unidad;
  }
  document.getElementById('btnModalSave').textContent = 'Actualizar';
  document.getElementById('modalBg').classList.add('open');
}

function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
}

function onUnitSelect(){
  document.getElementById('mUnidadCustomWrap').style.display =
    document.getElementById('mUnidadSelect').value === 'otro' ? 'block' : 'none';
}

async function saveModal(){
  const nombre = document.getElementById('mNombre').value.trim();
  const unitSel = document.getElementById('mUnidadSelect').value;
  const unidad = unitSel === 'otro'
    ? document.getElementById('mUnidadCustom').value.trim()
    : unitSel;

  if (!nombre) return toast('Escribe el nombre del producto', true);
  if (!unidad) return toast('Escribe la unidad', true);

  const btn = document.getElementById('btnModalSave');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'Guardando…';

  try{
    if (EDITING_PRODUCT) {
      const d = await api({
        action:'editProducto',
        token:TOKEN,
        id: EDITING_PRODUCT.id,
        nombre,
        unidad
      });
      if (!d.ok) throw new Error(d.error || 'Error');
      toast('Producto actualizado');
    } else {
      const cantidadRaw = document.getElementById('mCantidad').value.trim();
      const cantidadInicial = Number(String(cantidadRaw).replace(',', '.'));
      if (!isFinite(cantidadInicial) || cantidadInicial < 0) {
        toast('Cantidad inicial inválida', true);
        btn.disabled = false;
        btn.textContent = originalText;
        return;
      }
      const d = await api({
        action:'addProductoRapido',
        token:TOKEN,
        seccion:USUARIO.seccion,
        nombre,
        unidad,
        cantidadInicial
      });
      if (!d.ok) throw new Error(d.error || 'Error');
      toast('Producto agregado');
    }

    closeModal();
    await Promise.all([loadCatalogo(), loadHistorial()]);
  } catch(e){
    toast(e.message || 'No se pudo guardar', true);
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

async function toggleProducto(id, activo){
  const ok = confirm(activo ? '¿Activar producto?' : '¿Desactivar producto?');
  if (!ok) return;

  try{
    const d = await api({ action:'toggleProducto', token:TOKEN, id, activo });
    if (!d.ok) throw new Error(d.error || 'Error');
    toast(activo ? 'Producto activado' : 'Producto desactivado');
    await loadCatalogo();
  }catch(e){
    toast(e.message || 'No se pudo cambiar el estado', true);
  }
}

// ────────────────────────────────────────────────────────────
//  HISTORIAL
// ────────────────────────────────────────────────────────────
async function loadHistorial(){
  const list = document.getElementById('histList');
  list.innerHTML = '<div class="loading">Cargando historial…</div>';

  try{
    const d = await api({
      action:'getHistorialArea',
      token:TOKEN,
      seccion:USUARIO.seccion,
      limit: 80
    });
    HISTORIAL = d.historial || [];
    renderHistorial();
  }catch(e){
    list.innerHTML = '<div class="empty">No se pudo cargar el historial.</div>';
  }
}

function renderHistorial(){
  const list = document.getElementById('histList');
  if (!HISTORIAL.length) {
    list.innerHTML = '<div class="empty">Sin movimientos todavía.</div>';
    return;
  }

  let html = '';
  HISTORIAL.forEach(h => {
    html += `
      <div class="hist-card">
        <div class="hist-top">
          <div>
            <div class="hist-name">${escapeHtml(h.productoNombre)}</div>
            <div class="hist-meta">${escapeHtml(h.fecha)} · ${escapeHtml(h.hora)} · ${escapeHtml(h.usuarioNombre)}</div>
          </div>
          <div class="hist-qty">${escapeHtml(String(h.cantidad))} ${escapeHtml(h.unidad)}</div>
        </div>
        ${h.nota ? `<div class="hist-meta" style="margin-top:8px;color:#b9b9b9">${escapeHtml(h.nota)}</div>` : ''}
        ${h.fotoUrl ? `<div class="hist-photo"><a href="${h.fotoUrl}" target="_blank">VER FOTO →</a></div>` : ''}
      </div>`;
  });
  list.innerHTML = html;
}

function escapeHtml(str){
  return String(str ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#39;");
}
function esc(str){ return escapeHtml(str); }

document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target.id === 'modalBg') closeModal();
});
</script>
</body>
</html>
