<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventario</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#080808;color:#e8e4dc;font-family:'Space Mono',monospace;min-height:100vh}
  header{background:#0e0e0e;border-bottom:1px solid #1c1c1c;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
  .hl{display:flex;align-items:center;gap:12px}
  .hlogo{width:32px;height:32px;object-fit:contain}
  .htitle{font-size:11px;font-weight:700;letter-spacing:3px}
  .huser{font-size:10px;color:#555;letter-spacing:1px;margin-top:2px}
  .badge{font-size:9px;font-weight:700;letter-spacing:2px;padding:5px 12px;border-radius:20px;text-transform:uppercase}
  .badge.cocina{background:#0a1f14;color:#3ecf8e;border:1px solid #153a22}
  .badge.barra{background:#1a0a10;color:#e05555;border:1px solid #3a1520}
  nav{display:flex;background:#0e0e0e;border-bottom:1px solid #1c1c1c}
  .tab{flex:1;padding:13px 6px;text-align:center;font-size:10px;letter-spacing:1px;color:#444;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;text-transform:uppercase}
  .tab.active{color:#e8e4dc;border-bottom-color:#e8e4dc}
  .screen{display:none;padding:20px}
  .screen.active{display:block}
  .sec-label{font-size:10px;letter-spacing:3px;color:#555;text-transform:uppercase;margin-bottom:18px}

  /* conteo */
  .product-card{background:#0e0e0e;border:1px solid #1a1a1a;border-radius:14px;padding:16px;margin-bottom:10px;transition:border-color .2s}
  .product-card.has-value{border-color:#2a2a2a}
  .ptop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .pname{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:400;letter-spacing:1px}
  .punit-badge{font-size:9px;color:#555;padding:3px 8px;border:1px solid #1e1e1e;border-radius:10px;letter-spacing:1px}
  .qty-row{display:flex;align-items:center;gap:8px}
  .qty-input{flex:1;background:#080808;border:1px solid #1e1e1e;border-radius:10px;color:#e8e4dc;font-family:'Space Mono',monospace;font-size:22px;font-weight:700;padding:9px 12px;text-align:center;-moz-appearance:textfield}
  .qty-input::-webkit-inner-spin-button,.qty-input::-webkit-outer-spin-button{-webkit-appearance:none}
  .qty-input:focus{outline:none;border-color:#444}
  .qty-unit{font-size:11px;color:#444;letter-spacing:1px;white-space:nowrap;min-width:32px}
  .extras{margin-top:10px;display:flex;gap:8px}
  .btn-extra{padding:7px 14px;background:#141414;border:1px solid #1e1e1e;border-radius:8px;color:#555;font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
  .btn-extra.active{border-color:#2a2a2a;color:#e8e4dc}
  .nota-input{margin-top:8px;width:100%;background:#080808;border:1px solid #1a1a1a;border-radius:8px;color:#666;font-family:'Cormorant Garamond',serif;font-size:14px;padding:9px 12px;resize:none;transition:all .2s}
  .nota-input:focus{outline:none;border-color:#2a2a2a;color:#e8e4dc}
  .foto-input{display:none}
  .foto-preview{margin-top:8px;position:relative;display:none}
  .foto-preview img{width:100%;max-height:160px;object-fit:cover;border-radius:10px;border:1px solid #1e1e1e}
  .foto-del{position:absolute;top:6px;right:6px;background:rgba(8,8,8,.8);border:1px solid #2a2a2a;border-radius:6px;color:#e05555;font-size:10px;padding:4px 8px;cursor:pointer}
  .foto-estado{font-size:10px;margin-top:6px;letter-spacing:1px}
  .foto-estado.ok{color:#3ecf8e}.foto-estado.uploading{color:#888}.foto-estado.err{color:#e05555}
  .btn-guardar{position:fixed;bottom:24px;left:20px;right:20px;max-width:480px;margin:0 auto;padding:18px;background:#e8e4dc;color:#080808;border:none;border-radius:14px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:4px;cursor:pointer;transition:all .15s;z-index:20}
  .btn-guardar:active{transform:scale(.98)}
  .btn-guardar:disabled{opacity:.2;cursor:not-allowed}
  .btn-guardar.saving{background:#141414;color:#444;border:1px solid #1e1e1e}

  /* historial */
  .hist-item{background:#0e0e0e;border:1px solid #1a1a1a;border-radius:12px;padding:14px 16px;margin-bottom:8px}
  .hist-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
  .hist-product{font-family:'Cormorant Garamond',serif;font-size:16px}
  .hist-qty{font-size:16px;font-weight:700;white-space:nowrap;margin-left:8px}
  .hist-meta{font-size:10px;color:#444;letter-spacing:1px}
  .hist-nota{font-size:12px;color:#555;margin-top:5px;font-family:'Cormorant Garamond',serif;font-style:italic}
  .hist-foto a{font-size:10px;color:#888;letter-spacing:1px;text-decoration:none;border:1px solid #1e1e1e;padding:4px 10px;border-radius:6px;display:inline-block;margin-top:6px}

  /* agregar producto */
  .form-wrap{max-width:480px;margin:0 auto}
  .form-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;letter-spacing:3px;margin-bottom:6px}
  .form-sub{font-size:10px;color:#444;letter-spacing:1px;margin-bottom:28px;line-height:1.8}

  .field{margin-bottom:20px}
  .field label{display:block;font-size:10px;letter-spacing:2px;color:#555;text-transform:uppercase;margin-bottom:8px}
  .field .hint{font-size:10px;color:#333;letter-spacing:1px;margin-top:6px}

  /* campo nombre */
  .input-text{width:100%;background:#0e0e0e;border:1px solid #1e1e1e;border-radius:12px;color:#e8e4dc;font-family:'Cormorant Garamond',serif;font-size:18px;padding:14px 16px;transition:border-color .2s}
  .input-text:focus{outline:none;border-color:#333}

  /* campo cantidad — texto libre, decimal */
  .cant-wrap{display:flex;align-items:center;gap:10px}
  .input-cant{flex:1;background:#0e0e0e;border:1px solid #1e1e1e;border-radius:12px;color:#e8e4dc;font-family:'Space Mono',monospace;font-size:26px;font-weight:700;padding:14px 16px;text-align:center;-moz-appearance:textfield;transition:border-color .2s}
  .input-cant::-webkit-inner-spin-button,.input-cant::-webkit-outer-spin-button{-webkit-appearance:none}
  .input-cant:focus{outline:none;border-color:#444}
  .cant-unit-label{font-size:12px;color:#444;letter-spacing:2px;min-width:44px;text-align:left}

  /* chips unidad */
  .unit-chips{display:flex;gap:8px;flex-wrap:wrap}
  .unit-chip{padding:10px 14px;background:#0e0e0e;border:1px solid #1e1e1e;border-radius:10px;color:#555;font-size:10px;letter-spacing:2px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none}
  .unit-chip.sel{background:#1a1a1a;border-color:#3a3a3a;color:#e8e4dc}
  .unit-custom{margin-top:10px;display:none}
  .unit-custom .input-text{font-family:'Space Mono',monospace;font-size:14px;padding:12px 14px}

  /* resumen */
  .resumen{background:#0e0e0e;border:1px solid #1e1e1e;border-radius:14px;padding:16px 18px;margin-bottom:20px;display:none}
  .resumen-lbl{font-size:10px;letter-spacing:2px;color:#444;text-transform:uppercase;margin-bottom:12px}
  .resumen-producto{font-family:'Cormorant Garamond',serif;font-size:20px;color:#e8e4dc;margin-bottom:4px}
  .resumen-cantidad{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;color:#e8e4dc}
  .resumen-unidad{font-size:12px;color:#666;letter-spacing:2px;margin-left:6px}

  .btn-agregar{width:100%;padding:18px;background:#e8e4dc;color:#080808;border:none;border-radius:14px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:4px;cursor:pointer;transition:all .15s}
  .btn-agregar:active{transform:scale(.98);background:#ccc8c0}
  .btn-agregar:disabled{opacity:.2;cursor:not-allowed}

  /* success */
  .success-card{background:#0a1f14;border:1px solid #153a22;border-radius:14px;padding:24px;text-align:center;margin-bottom:20px;display:none}
  .s-check{font-size:36px;margin-bottom:10px}
  .s-nombre{font-family:'Cormorant Garamond',serif;font-size:22px;color:#3ecf8e;margin-bottom:4px}
  .s-meta{font-size:11px;color:#1a7a4a;letter-spacing:2px;margin-bottom:16px}
  .btn-otro{padding:10px 24px;background:transparent;border:1px solid #153a22;border-radius:10px;color:#3ecf8e;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;cursor:pointer}

  .empty{text-align:center;color:#2a2a2a;font-size:11px;padding:60px 0;letter-spacing:3px;line-height:2}
  .loading{text-align:center;padding:60px 0;color:#333;font-size:11px;letter-spacing:3px}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;font-size:11px;letter-spacing:2px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .toast.ok{background:#0a1f14;border:1px solid #153a22;color:#3ecf8e;opacity:1}
  .toast.err{background:#1a0a10;border:1px solid #3a1520;color:#e05555;opacity:1}
  .toast.hide{opacity:0}
</style>
</head>

<div class="screen active" id="sConteo">

<!-- ── AGREGAR PRODUCTO ───────────────────────────────────── -->
<div class="screen" id="sAgregar">
  <div class="form-wrap">

    <div class="success-card" id="successCard">
      <div class="s-check">✓</div>
      <div class="s-nombre" id="sNombre">—</div>
      <div class="s-meta"   id="sMeta">—</div>
      <button class="btn-otro" onclick="resetForm()">+ AGREGAR OTRO</button>
    </div>

    <div id="formAgregar">
      <div class="form-title">Nuevo producto</div>
      <div class="form-sub">Agrega lo que tienes en tu área.<br>Escribe la cantidad exacta que tienes ahorita.</div>

      <!-- Nombre -->
      <div class="field">
        <label>Producto</label>
        <input class="input-text" type="text" id="aNombre"
               placeholder="Ej: Aceite vegetal, Bacardí 1L, Tomate..."
               oninput="actualizarResumen()">
      </div>

      <!-- Unidad primero para que la cantidad sepa qué mostrar -->
      <div class="field">
        <label>Unidad</label>
        <div class="unit-chips">
          <div class="unit-chip sel" onclick="selUnit('kg',   this)">kg</div>
          <div class="unit-chip"    onclick="selUnit('g',    this)">g</div>
          <div class="unit-chip"    onclick="selUnit('L',    this)">litro</div>
          <div class="unit-chip"    onclick="selUnit('mL',   this)">mL</div>
          <div class="unit-chip"    onclick="selUnit('pza',  this)">pieza</div>
          <div class="unit-chip"    onclick="selUnit('caja', this)">caja</div>
          <div class="unit-chip"    onclick="selUnit('bolsa',this)">bolsa</div>
          <div class="unit-chip"    onclick="selUnit('costal',this)">costal</div>
          <div class="unit-chip"    onclick="selUnit('botella',this)">botella</div>
          <div class="unit-chip"    onclick="selUnit('otro', this)">otro</div>
        </div>
        <div class="unit-custom" id="unitCustomDiv">
          <input class="input-text" type="text" id="aUnidadCustom"
                 placeholder="Escribe la unidad..." oninput="actualizarResumen()">
        </div>
      </div>

      <!-- Cantidad — siempre decimal, teclado numérico -->
      <div class="field">
        <label>Cantidad</label>
        <div class="cant-wrap">
          <input class="input-cant" type="number" id="aCantidad"
                 min="0" step="any" inputmode="decimal"
                 placeholder="0" oninput="actualizarResumen()">
          <span class="cant-unit-label" id="cantUnitLabel">kg</span>
        </div>
        <div class="hint" id="cantHint">Puedes escribir decimales: 2.5 · 0.750 · 340</div>
      </div>

      <!-- Resumen -->
      <div class="resumen" id="resumen">
        <div class="resumen-lbl">Resumen</div>
        <div class="resumen-producto" id="rNombre">—</div>
        <div>
          <span class="resumen-cantidad" id="rCantidad">—</span>
          <span class="resumen-unidad"   id="rUnidad">—</span>
        </div>
      </div>

      <button class="btn-agregar" id="btnAgregar" onclick="agregarProducto()">GUARDAR PRODUCTO</button>
    </div>
  </div>
</div>

</div>

<button class="btn-guardar" id="btnG" onclick="guardar()">GUARDAR CONTEO</button>
<div class="toast" id="toast"></div>

<script>
var API     = 'https://script.google.com/macros/s/AKfycbzQ3VGL57gj-GA0AfgTAL6djmdEJgQKYEnhtNnJbX0N1ei9MK1Tzfq-aRT2sykhCaM/exec';
var TOKEN   = localStorage.getItem('token')   || '';
var USUARIO = JSON.parse(localStorage.getItem('usuario') || '{}');
var CATALOGO = [], fotoUrls = {}, mUnidad = 'kg';

if (!TOKEN) { window.location.href = 'index.html'; } else { init(); }

async function init() {
  document.getElementById('huser').textContent = USUARIO.nombre || '';
  var b = document.getElementById('badge');
  b.textContent = (USUARIO.seccion||'').toUpperCase();
  b.className   = 'badge ' + (USUARIO.seccion||'');
  document.getElementById('secLabel').textContent = (USUARIO.seccion||'').toUpperCase() + ' — STOCK ACTUAL';
  await loadCatalogo();
  loadHistorial();
}

// ── CONTEO ─────────────────────────────────────────────────
async function loadCatalogo() {
  try {
    var r    = await fetch(API, { method:'POST', body: JSON.stringify({ action:'getCatalogo', token:TOKEN }) });
    var data = await r.json();
    if (!data.ok) { toast(data.error||'Error', true); return; }
    CATALOGO = data.catalogo || [];
    renderProductos();
  } catch(e) { toast('Error al cargar', true); }
}

function renderProductos() {
  var list = document.getElementById('productList');
  if (!CATALOGO.length) {
    list.innerHTML = '<div class="empty">SIN PRODUCTOS<br><span style="font-size:10px">Usa "+ Producto" para agregar</span></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < CATALOGO.length; i++) {
    var p = CATALOGO[i];
    html += '<div class="product-card" id="card_'+i+'">' +
      '<div class="ptop">' +
        '<span class="pname">'+p.nombre+'</span>' +
        '<span class="punit-badge">'+p.unidad+'</span>' +
      '</div>' +
      '<div class="qty-row">' +
        '<input class="qty-input" type="number" id="qty_'+i+'" min="0" step="any" inputmode="decimal" placeholder="—" oninput="onQty('+i+')">' +
        '<span class="qty-unit" style="font-size:11px;color:#444;letter-spacing:1px;flex-shrink:0">'+p.unidad+'</span>' +
      '</div>' +
      '<div class="extras">' +
        '<button class="btn-extra" id="btnNota_'+i+'" onclick="toggleNota('+i+')">+ NOTA</button>' +
        '<button class="btn-extra" id="btnFoto_'+i+'" onclick="triggerFoto('+i+')">📷 FOTO</button>' +
      '</div>' +
      '<textarea class="nota-input" id="nota_'+i+'" rows="2" placeholder="Observación opcional..." style="display:none"></textarea>' +
      '<div>' +
        '<input class="foto-input" type="file" accept="image/*" capture="environment" id="fotoInput_'+i+'" onchange="onFotoSelected('+i+',this)">' +
        '<div class="foto-preview" id="fotoPreview_'+i+'"><img id="fotoImg_'+i+'" src=""><button class="foto-del" onclick="quitarFoto('+i+')">✕</button></div>' +
        '<div class="foto-estado" id="fotoEstado_'+i+'"></div>' +
      '</div>' +
    '</div>';
  }
  list.innerHTML = html;
}

function onQty(i) { document.getElementById('card_'+i).classList.toggle('has-value', document.getElementById('qty_'+i).value !== ''); }

function toggleNota(i) {
  var ta=document.getElementById('nota_'+i), btn=document.getElementById('btnNota_'+i), vis=ta.style.display!=='none';
  ta.style.display=vis?'none':'block'; btn.textContent=vis?'+ NOTA':'− NOTA'; btn.classList.toggle('active',!vis);
  if(!vis) setTimeout(function(){ta.focus();},50);
}
function triggerFoto(i){ document.getElementById('fotoInput_'+i).click(); }
function onFotoSelected(i,input){
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    document.getElementById('fotoImg_'+i).src=e.target.result;
    document.getElementById('fotoPreview_'+i).style.display='block';
    document.getElementById('btnFoto_'+i).classList.add('active');
    document.getElementById('btnFoto_'+i).textContent='📷 ✓';
  };
  reader.readAsDataURL(file);
  comprimirYSubir(i, file);
}
function comprimirYSubir(i,file){
  setFotoEstado(i,'Subiendo...','uploading');
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var mw=800,w=img.width,h=img.height;
      if(w>mw){h=Math.round(h*mw/w);w=mw;}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      subirFoto(i,c.toDataURL('image/jpeg',.75).split(',')[1],'image/jpeg');
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
async function subirFoto(i,b64,mime){
  var nom=CATALOGO[i]?CATALOGO[i].nombre.replace(/[^a-z0-9]/gi,'_'):'foto';
  try{
    var r=await fetch(API,{method:'POST',body:JSON.stringify({action:'subirFoto',token:TOKEN,base64:b64,mimeType:mime,producto:nom})});
    var d=await r.json();
    if(d.ok){fotoUrls[i]=d.url;setFotoEstado(i,'✓ Lista','ok');}
    else{setFotoEstado(i,'Error','err');delete fotoUrls[i];}
  }catch(e){setFotoEstado(i,'Error','err');delete fotoUrls[i];}
}
function setFotoEstado(i,msg,cls){var el=document.getElementById('fotoEstado_'+i);el.textContent=msg;el.className='foto-estado '+cls;}
function quitarFoto(i){
  document.getElementById('fotoInput_'+i).value='';
  document.getElementById('fotoImg_'+i).src='';
  document.getElementById('fotoPreview_'+i).style.display='none';
  document.getElementById('fotoEstado_'+i).textContent='';
  document.getElementById('fotoEstado_'+i).className='foto-estado';
  document.getElementById('btnFoto_'+i).classList.remove('active');
  document.getElementById('btnFoto_'+i).textContent='📷 FOTO';
  delete fotoUrls[i];
}

async function guardar(){
  var ps=[];
  for(var i=0;i<CATALOGO.length;i++){
    var v=document.getElementById('qty_'+i).value; if(v==='') continue;
    var n=parseFloat(v.replace(',','.'));
    if(isNaN(n)||n<0){toast('Cantidad inválida en '+CATALOGO[i].nombre,true);return;}
    ps.push({id:CATALOGO[i].id,nombre:CATALOGO[i].nombre,cantidad:n,nota:document.getElementById('nota_'+i).value,fotoUrl:fotoUrls[i]||''});
  }
  if(!ps.length){toast('Captura al menos un producto',true);return;}
  for(var i=0;i<CATALOGO.length;i++){
    var est=document.getElementById('fotoEstado_'+i);
    if(est&&est.className.indexOf('uploading')!==-1){toast('Espera, subiendo foto...',true);return;}
  }
  var btn=document.getElementById('btnG');
  btn.disabled=true;btn.classList.add('saving');btn.textContent='GUARDANDO...';
  try{
    var r=await fetch(API,{method:'POST',body:JSON.stringify({action:'guardarConteo',token:TOKEN,productos:ps,seccion:USUARIO.seccion})});
    var d=await r.json();
    btn.disabled=false;btn.classList.remove('saving');btn.textContent='GUARDAR CONTEO';
    if(d.ok){
      toast('✓ '+d.guardados+' guardados');
      for(var i=0;i<CATALOGO.length;i++){
        document.getElementById('qty_'+i).value='';
        document.getElementById('card_'+i).classList.remove('has-value');
        var ta=document.getElementById('nota_'+i);ta.value='';ta.style.display='none';
        document.getElementById('btnNota_'+i).textContent='+ NOTA';
        document.getElementById('btnNota_'+i).classList.remove('active');
        quitarFoto(i);
      }
      fotoUrls={};
    } else { toast(d.error||'Error',true); }
  }catch(e){btn.disabled=false;btn.classList.remove('saving');btn.textContent='GUARDAR CONTEO';toast('Error de conexión',true);}
}

// ── AGREGAR PRODUCTO ────────────────────────────────────────
function selUnit(val, el) {
  mUnidad = val;
  document.querySelectorAll('.unit-chip').forEach(function(c){c.classList.remove('sel');});
  el.classList.add('sel');
  document.getElementById('unitCustomDiv').style.display = val==='otro' ? 'block' : 'none';
  // actualizar etiqueta junto al campo de cantidad
  var label = val==='otro' ? (document.getElementById('aUnidadCustom').value||'') : val;
  document.getElementById('cantUnitLabel').textContent = label;
  // hint según tipo
  var hints = {
    'kg':'Ej: 2.5 · 0.750 · 12',
    'g':'Ej: 500 · 340 · 1200',
    'L':'Ej: 1.5 · 0.750 · 3',
    'mL':'Ej: 750 · 330 · 1000',
    'pza':'Ej: 3 · 12 · 24',
    'caja':'Ej: 2 · 5',
    'bolsa':'Ej: 4 · 10',
    'costal':'Ej: 1 · 3',
    'botella':'Ej: 6 · 12'
  };
  document.getElementById('cantHint').textContent = hints[val] || 'Escribe la cantidad exacta';
  actualizarResumen();
}

function actualizarResumen() {
  var nombre   = document.getElementById('aNombre').value.trim();
  var cantRaw  = document.getElementById('aCantidad').value.replace(',','.');
  var cantidad = parseFloat(cantRaw);
  var unidad   = mUnidad==='otro' ? document.getElementById('aUnidadCustom').value.trim() : mUnidad;
  document.getElementById('cantUnitLabel').textContent = unidad || '—';
  var res = document.getElementById('resumen');
  if (nombre && !isNaN(cantidad) && cantidad >= 0 && unidad) {
    document.getElementById('rNombre').textContent   = nombre;
    document.getElementById('rCantidad').textContent = cantidad;
    document.getElementById('rUnidad').textContent   = unidad;
    res.style.display = 'block';
  } else {
    res.style.display = 'none';
  }
}

async function agregarProducto() {
  var nombre   = document.getElementById('aNombre').value.trim();
  var cantRaw  = document.getElementById('aCantidad').value.replace(',','.');
  var cantidad = parseFloat(cantRaw);
  var unidad   = mUnidad==='otro' ? document.getElementById('aUnidadCustom').value.trim() : mUnidad;

  if (!nombre)          { toast('Escribe el nombre del producto', true); return; }
  if (isNaN(cantidad))  { toast('Escribe la cantidad que tienes', true); return; }
  if (cantidad < 0)     { toast('La cantidad no puede ser negativa', true); return; }
  if (!unidad)          { toast('Escribe la unidad', true); return; }

  var btn = document.getElementById('btnAgregar');
  btn.disabled=true; btn.textContent='GUARDANDO...';

  try {
    // 1. Crear producto en catálogo
    var r1   = await fetch(API,{method:'POST',body:JSON.stringify({action:'addProducto',token:TOKEN,nombre:nombre,unidad:unidad,seccion:USUARIO.seccion})});
    var d1   = await r1.json();
    if (!d1.ok) { toast(d1.error||'Error al crear', true); btn.disabled=false; btn.textContent='GUARDAR PRODUCTO'; return; }

    // 2. Registrar conteo inicial
    await fetch(API,{method:'POST',body:JSON.stringify({action:'guardarConteo',token:TOKEN,seccion:USUARIO.seccion,
      productos:[{id:d1.id,nombre:nombre,cantidad:cantidad,nota:'Alta inicial',fotoUrl:''}]})});

    btn.disabled=false; btn.textContent='GUARDAR PRODUCTO';
    document.getElementById('sNombre').textContent = nombre;
    document.getElementById('sMeta').textContent   = cantidad+' '+unidad+' · '+USUARIO.seccion.toUpperCase();
    document.getElementById('successCard').style.display = 'block';
    document.getElementById('formAgregar').style.display = 'none';
    await loadCatalogo();

  } catch(e) { btn.disabled=false; btn.textContent='GUARDAR PRODUCTO'; toast('Error de conexión',true); }
}

function resetForm() {
  document.getElementById('aNombre').value    = '';
  document.getElementById('aCantidad').value  = '';
  document.getElementById('aUnidadCustom').value = '';
  document.querySelectorAll('.unit-chip').forEach(function(c){c.classList.remove('sel');});
  document.querySelector('.unit-chip').classList.add('sel');
  mUnidad = 'kg';
  document.getElementById('unitCustomDiv').style.display = 'none';
  document.getElementById('cantUnitLabel').textContent   = 'kg';
  document.getElementById('cantHint').textContent        = 'Puedes escribir decimales: 2.5 · 0.750 · 340';
  document.getElementById('resumen').style.display       = 'none';
  document.getElementById('successCard').style.display  = 'none';
  document.getElementById('formAgregar').style.display  = 'block';
  setTimeout(function(){document.getElementById('aNombre').focus();},100);
}

// ── HISTORIAL ──────────────────────────────────────────────
async function loadHistorial() {
  try {
    var r    = await fetch(API,{method:'POST',body:JSON.stringify({action:'getHistorialUser',token:TOKEN})});
    var data = await r.json();
    var list = document.getElementById('histList');
    if (!data.ok||!data.historial.length){list.innerHTML='<div class="empty">SIN REGISTROS</div>';return;}
    var html='';
    for(var i=0;i<data.historial.length;i++){
      var h=data.historial[i];
      html+='<div class="hist-item">'+
        '<div class="hist-top"><span class="hist-product">'+h.productoNombre+'</span><span class="hist-qty">'+h.cantidad+'</span></div>'+
        '<div class="hist-meta">'+h.fecha+' · '+h.hora+'</div>'+
        (h.nota?'<div class="hist-nota">'+h.nota+'</div>':'')+
        (h.fotoUrl?'<div class="hist-foto"><a href="'+h.fotoUrl+'" target="_blank">VER FOTO →</a></div>':'')+
      '</div>';
    }
    list.innerHTML=html;
  }catch(e){document.getElementById('histList').innerHTML='<div class="empty">ERROR</div>';}
}

function showTab(name){
  ['conteo','agregar','historial'].forEach(function(t){
    document.getElementById('s'+cap(t)).classList.toggle('active',t===name);
    document.getElementById('t'+cap(t)).classList.toggle('active',t===name);
  });
  document.getElementById('btnG').style.display=name==='conteo'?'':'none';
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function toast(msg,isErr){
  var t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(isErr?'err':'ok');
  setTimeout(function(){t.className='toast hide';},3000);
}
</script>
